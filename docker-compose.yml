services:
  cloudflared-tunnel:
    image: cloudflare/cloudflared:2026.5.2
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      auth-service:
        condition: service_healthy
      core-backend:
        condition: service_healthy
    networks:
      - akashadesk-internal
      - akashadesk-egress
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cloudflared", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-akashadesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-akashadesk}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - akashadesk-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./services/auth-identity
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-akashadesk}:${POSTGRES_PASSWORD:-change-me}@postgres-db:5432/${POSTGRES_DB:-akashadesk}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-replace-with-a-strong-random-secret}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://auth.yourdomain.com}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-https://auth.yourdomain.com,https://api.yourdomain.com}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    expose:
      - "3000"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - akashadesk-internal
      - akashadesk-egress
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "run", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-backend:
    build:
      context: .
      dockerfile: services/core-engine/Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB:-akashadesk}
      AUTH_SERVICE_URL: http://auth-service:3000
      AI_SERVICE_URL: http://ai-service:8000
      CORE_DEV_BEARER_TOKEN: ${CORE_DEV_BEARER_TOKEN:-replace-with-a-local-dev-token-at-least-16-chars}
      AI_AGENT_INTERNAL_TOKEN: ${AI_AGENT_INTERNAL_TOKEN:-replace-with-an-internal-service-token}
    expose:
      - "8080"
    depends_on:
      postgres-db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - akashadesk-internal
      - akashadesk-egress
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./services/ai-agent
    environment:
      PORT: "8000"
      AI_AGENT_INTERNAL_TOKEN: ${AI_AGENT_INTERNAL_TOKEN:-replace-with-an-internal-service-token}
      ASTRO_REPO_OWNER: ${ASTRO_REPO_OWNER:-}
      ASTRO_REPO_NAME: ${ASTRO_REPO_NAME:-}
      ASTRO_CONTENT_PATH: ${ASTRO_CONTENT_PATH:-src/content/blog}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    expose:
      - "8000"
    networks:
      - akashadesk-internal
      - akashadesk-egress
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

networks:
  akashadesk-internal:
    internal: true
  akashadesk-egress:
